[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitasenior-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.162.0", "uvicorn==0.44.0", "SQLAlchemy==2.0.43", "pydantic==2.12.4", "python-multipart==0.0.32", "tzdata==2025.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# F0-only assertions are frozen stage markers, not a permanent contract: run them
# explicitly with `pytest -m f0_stage`. The default suite tracks real capabilities.
markers = ["f0_stage: frozen F0 baseline assertions (all-business-501, five capabilities only)"]
addopts = "-m 'not f0_stage'"
